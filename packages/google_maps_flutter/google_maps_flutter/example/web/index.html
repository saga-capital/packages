<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="example">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Google Maps Web Example</title>

  <link rel="manifest" href="manifest.json">

  <!-- Styles for ForkMarkerFeaturesPage (AdvancedMarker + WebMarkerOverlay demo). -->
  <link rel="stylesheet" href="fd_marker_styles.css">

  <!--
    Google Maps JS API key is loaded from a local-only sidecar file:
    `web/local_keys.js` (which is .gitignored). See `web/local_keys.example.js`
    for a template — copy it to `web/local_keys.js` and fill in your own key.
    The sidecar defines `window.GMAPS_KEY`, which the inline script below uses
    to inject the maps.googleapis.com script tag at runtime.
  -->
  <script src="local_keys.js"></script>
  <script>
    (function () {
      var key = (typeof window !== 'undefined' && window.GMAPS_KEY) || '';
      if (!key || key === 'YOUR_GOOGLE_MAPS_JS_API_KEY_HERE') {
        console.error(
          'Google Maps JS API key missing. Copy web/local_keys.example.js ' +
          'to web/local_keys.js and set window.GMAPS_KEY to your real key.'
        );
        return;
      }
      var s = document.createElement('script');
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' +
          encodeURIComponent(key) +
          '&libraries=marker,geometry,visualization';
      document.head.appendChild(s);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@googlemaps/markerclusterer@2.5.3/dist/index.umd.min.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
